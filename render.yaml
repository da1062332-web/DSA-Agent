# Render blueprint for the API. Secrets are entered in the Render dashboard (sync: false), never in this file.
# Root directory apps/api: the install runs there, so every workspace the API imports must be declared in apps/api/package.json.
services:
  - type: web
    name: dsa-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: APP_SIGNING_SECRET
        sync: false
      - key: CLAMAV_ADDRESS
        sync: false
