                      type: string
                      pattern: ^\+?[1-9]\d{7,14}$
                    email:
                      type: string
                      format: email
                    dateOfBirth:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    city:
                      type: string
                      minLength: 2
                      maxLength: 100
                    state:
                      type: string
                      minLength: 2
                      maxLength: 100
                    pincode:
                      type: string
                      pattern: ^\d{6}$
                    employmentType:
                      type: string
                      enum:
                        - SALARIED
