  /recover:
    post:
      tags: *a12
      servers: *a13
      operationId: API-AUTH-007
      summary: Request a password reset email
      description: Used by /forgot-password. Always returns 200, so the response never reveals whether the email exists.
      security: []
      parameters:
        - *a14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
