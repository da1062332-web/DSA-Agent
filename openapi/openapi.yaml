                      - totp
                  status:
                    type: string
                    enum:
                      - unverified
                      - verified
                  totp:
                    type: object
                    properties:
                      qr_code:
                        type: string
                        description: SVG QR code to scan with Google or Microsoft Authenticator.
                      secret:
                        type: string
                        description: Manual entry key if the QR code cannot be scanned.
                      uri:
                        type: string
                    required:
                      - qr_code
                      - secret
                      - uri
                required:
                  - id
                  - friendly_name
                  - factor_type
                  - status
                  - totp
        "401":
          description: Rejected by Supabase (see error_code, e.g. invalid_credentials)
          content:
