                    - consentArtifactRef
                    - optInTimestamp
                connectorId:
                  type: string
                  pattern: ^con_[0-9A-HJKMNP-TV-Z]{26}$
                metadata:
                  type: object
                  additionalProperties: {}
              required:
                - externalReferenceId
