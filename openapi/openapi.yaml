                  - email
        "401":
          description: Rejected by Supabase (see error_code, e.g. invalid_credentials)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error_code:
                    type: string
                  msg:
                    type: string
