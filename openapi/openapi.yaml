    post:
      operationId: API-SND-001
      summary: "API-SND-001: Record or Revise Sanction"
      tags:
        - MOD-SND Sanctions & Disbursement
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  exclusiveMinimum: 0
                tenureMonths:
                  type: integer
                  minimum: 1
                rateValue:
                  type: number
                  exclusiveMinimum: 0
                rateType:
                  type: string
                  enum:
                    - FIXED
                    - FLOATING
                benchmarkText:
                  type:
                    - string
                    - "null"
                  maxLength: 200
                feesText:
                  type:
                    - string
                    - "null"
                  maxLength: 500
                conditions:
                  type: array
                  items:
                    type: string
                    maxLength: 500
                  default: []
                sanctionDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                validUntil:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                letterDocumentId:
                  type:
                    - string
                    - "null"
                source:
                  type: string
                  enum:
                    - MANUAL
                    - LENDER_API
                    - EMAIL_PARSED
                  default: MANUAL
              required:
                - amount
                - tenureMonths
                - rateValue
                - rateType
                - sanctionDate
                - validUntil
      responses:
        "201":
          description: Sanction recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: number
                  amount:
                    type: number
                  status:
                    type: string
                required:
                  - id
                  - version
                  - amount
                  - status
