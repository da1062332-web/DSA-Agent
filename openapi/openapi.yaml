      operationId: API-BRE-017
      summary: Update test case
      tags:
        - MOD-BRE Rules
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: testCaseId
          in: path
        - schema:
            type: string
          required: true
          name: if-match
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                input:
                  type: object
                  additionalProperties: {}
                expectedStatus:
                  type: string
                  enum:
                    - OK
                    - NO_MATCH
                    - UNKNOWN
                expectedOutput:
                  type: object
                  additionalProperties: {}
                active:
                  type: boolean
      responses:
        "200":
          description: Test case updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^tc_[0-9A-HJKMNP-TV-Z]{26}$
                  tenantId:
                    type: string
                  ruleSetId:
                    type: string
                  name:
                    type: string
                  evaluationTime:
                    type: string
                  scope:
                    type: object
                    additionalProperties: {}
                  input:
                    type: object
                    additionalProperties: {}
                  expectedStatus:
                    type: string
                    enum: *a90
                  expectedOutput:
                    type: object
                    additionalProperties: {}
                  active:
                    type: boolean
                  lockVersion:
                    type: integer
                  createdAt:
                    type: string
                  createdBy:
                    type: string
                  updatedAt:
                    type: string
                  updatedBy:
                    type: string
                required:
                  - id
                  - tenantId
                  - ruleSetId
                  - name
                  - evaluationTime
                  - scope
                  - input
                  - expectedStatus
                  - expectedOutput
                  - active
                  - lockVersion
                  - createdAt
                  - createdBy
                  - updatedAt
                  - updatedBy
