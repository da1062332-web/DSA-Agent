  /v1/decisions/{decisionKey}/evaluations:
    post:
      operationId: API-BRE-025
      summary: Evaluate decision against facts (live or simulation mode)
      tags:
        - MOD-BRE Rules
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: decisionKey
          in: path
        - schema:
            type: string
          required: false
          name: idempotency-key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - LEAD
                        - CUSTOMER
                        - LOAN_APPLICATION
                        - TASK
                    id:
                      type: string
                  required:
                    - type
                    - id
                facts:
                  type: object
                  additionalProperties: {}
                scope:
                  type: object
                  properties:
                    branchId:
                      type: string
                    lenderId:
                      type: string
                    productVersionId:
                      type: string
                  default: {}
                evaluationTime:
                  type: string
                  format: date-time
                mode:
                  type: string
                  enum:
                    - LIVE
                    - SIMULATION
                  default: LIVE
              required:
                - subject
                - facts
      responses:
        "200":
          description: Decision evaluation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisionRecordId:
                    type: string
                  decisionKey:
                    type: string
                  ruleSetVersionId:
                    type:
                      - string
                      - "null"
                  status:
                    type: string
                    enum:
                      - OK
                      - NO_MATCH
                      - UNKNOWN
                      - ERROR
                      - TIMEOUT
                      - NO_VERSION
                  outputs:
                    type:
                      - object
                      - "null"
                    additionalProperties: {}
                  fallbackApplied:
                    type: boolean
                  fallbackPolicy:
                    type:
                      - string
                      - "null"
                    enum: *a44
                  errorCode:
                    type:
                      - string
                      - "null"
                  matchedRuleUids:
                    type: array
                    items:
                      type: string
                  inputHash:
                    type: string
                  replayed:
                    type: boolean
                  durationUs:
                    type: number
                required:
                  - decisionRecordId
                  - decisionKey
                  - ruleSetVersionId
                  - status
                  - outputs
                  - fallbackApplied
                  - matchedRuleUids
                  - inputHash
                  - replayed
                  - durationUs
        "400":
          description: Validation error
        "401":
          description: Unauthenticated
        "404":
          description: Decision key unknown
