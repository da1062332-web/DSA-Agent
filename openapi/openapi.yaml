                      type: string
                      pattern: ^[a-zA-Z0-9._-]{2,40}$
                    channel:
                      type: string
                      enum: *a36
                    evidenceRef:
                      type:
                        - string
                        - "null"
                  required:
                    - noticeVersion
                    - channel
              required:
                - fullName
                - mobile
                - productCategory
                - branchId
                - source
                - consent
      responses:
        "201":
          description: Lead created successfully
          headers:
            ETag:
              schema:
                type: string
              description: Lead lock version
          content:
