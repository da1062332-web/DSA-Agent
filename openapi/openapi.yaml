            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    pattern: ^upl_[0-9A-HJKMNP-TV-Z]{26}$
                  uploadUrl:
                    type: string
                    format: uri
                  token:
                    type: string
                  expiresAt:
                    type: string
                  items:
                    type: array
                    items:
                      type: string
                required:
                  - sessionId
                  - uploadUrl
                  - token
                  - expiresAt
                  - items
  /v1/partner/webhooks/subscriptions:
    post:
      summary: Register partner webhook subscription with HMAC signing
      tags:
        - Partner API - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                targetUrl:
                  type: string
                  format: uri
                subscribedEvents:
                  type: array
                  items:
                    type: string
                    enum: &a82
                      - lead.created
                      - lead.duplicate_flagged
                      - lead.qualified
                      - lead.state_changed
                      - lead.converted
                      - application.created
                      - application.state_changed
                      - lender_case.submitted
                      - sanction.approved
                      - disbursement.completed
                      - verification.completed
                  minItems: 1
                secret:
                  type: string
                  minLength: 16
                  maxLength: 128
              required:
                - name
                - targetUrl
                - subscribedEvents
      responses:
        "201":
          description: Webhook subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^whs_[0-9A-HJKMNP-TV-Z]{26}$
                  tenantId:
                    type: string
                    pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
                  partnerId:
                    type: string
                  name:
                    type: string
                  targetUrl:
                    type: string
                    format: uri
                  subscribedEvents:
                    type: array
                    items:
                      type: string
                  status:
                    type: string
                    enum: &a81
                      - ACTIVE
                      - PAUSED
                      - REVOKED
                  failureCount:
                    type: integer
                  lockVersion:
                    type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  signingSecret:
                    type: string
                required:
                  - id
                  - tenantId
                  - partnerId
                  - name
                  - targetUrl
                  - subscribedEvents
                  - status
                  - failureCount
                  - lockVersion
                  - createdAt
                  - updatedAt
    get:
      summary: List active partner webhook subscriptions
      tags:
        - Partner API - Webhooks
      responses:
        "200":
          description: List of webhook subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          pattern: ^whs_[0-9A-HJKMNP-TV-Z]{26}$
                        tenantId:
                          type: string
                          pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
                        partnerId:
                          type: string
                        name:
                          type: string
                        targetUrl:
                          type: string
                          format: uri
                        subscribedEvents:
                          type: array
                          items:
                            type: string
                        status:
                          type: string
                          enum: *a81
                        failureCount:
                          type: integer
                        lockVersion:
                          type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        signingSecret:
                          type: string
                      required:
                        - id
                        - tenantId
                        - partnerId
                        - name
                        - targetUrl
                        - subscribedEvents
                        - status
                        - failureCount
                        - lockVersion
                        - createdAt
                        - updatedAt
                required:
                  - data
