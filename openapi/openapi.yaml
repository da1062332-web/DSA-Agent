                      type: string
                      pattern: ^[a-zA-Z0-9._-]{2,40}$
                    channel:
                      type: string
                      enum: *a22
                    evidenceRef:
                      type:
                        - string
                        - "null"
                  required:
                    - noticeVersion
                    - channel
              required:
                - fullName
                - mobile
                - productCategory
                - branchId
                - source
                - consent
