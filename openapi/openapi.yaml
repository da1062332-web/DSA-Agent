                            issue:
                              type: string
                            meta:
                              type: object
                              additionalProperties: {}
                          required:
                            - issue
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - httpStatus
                      - correlationId
                      - retryable
                required:
                  - error
        "428":
          description: Precondition Required (missing If-Match header)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
