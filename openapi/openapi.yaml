        - url: https://<your-project-ref>.supabase.co/auth/v1
          description: Hosted Supabase project (replace <your-project-ref>)
      operationId: API-AUTH-001
      summary: Sign in with email and password
      description: Used by the login page. Returns a session. Pass grant_type=refresh_token to refresh it (API-AUTH-003).
      security: []
      parameters:
        - &a16
          name: apikey
          in: header
          required: true
          description: Supabase publishable key (VITE_SUPABASE_PUBLISHABLE_KEY). Never the secret key.
          schema:
            type: string
        - name: grant_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - password
              - refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      minLength: 12
                  required:
                    - email
                    - password
                  description: grant_type=password
                - type: object
                  properties:
                    refresh_token:
                      type: string
                  required:
                    - refresh_token
                  description: grant_type=refresh_token
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: "JWT. Send as Authorization: Bearer <token> on /v1 calls."
                  token_type:
                    type: string
                    enum:
                      - bearer
                  expires_in:
                    type: integer
                    description: Seconds until access_token expires (3600 by default).
                  expires_at:
                    type: integer
                  refresh_token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Auth user id. Equals app_user.idp_subject.
                      email:
                        type: string
                        format: email
                      app_metadata:
                        type: object
                        properties:
                          tenant_id:
                            type: string
                        required:
                          - tenant_id
                    required:
                      - id
                      - email
                      - app_metadata
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - expires_at
                  - refresh_token
                  - user
        "400":
          description: Rejected by Supabase (see error_code, e.g. invalid_credentials)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error_code:
                    type: string
                  msg:
                    type: string
  /logout:
    post:
      tags: *a14
      servers: *a15
      operationId: API-AUTH-004
      summary: Sign out
      description: scope=local signs out this device; others signs out every other device; global signs out everywhere.
      parameters:
        - *a16
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - local
              - others
              - global
      responses:
        "204":
          description: Signed out
        "401":
          description: Rejected by Supabase (see error_code, e.g. invalid_credentials)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error_code:
                    type: string
                  msg:
                    type: string
  /recover:
    post:
      tags: *a14
      servers: *a15
      operationId: API-AUTH-007
      summary: Request a password reset email
      description: Used by /forgot-password. Always returns 200, so the response never reveals whether the email exists.
      security: []
      parameters:
        - *a16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: Email sent if the account exists
  /user:
    put:
      tags: *a14
      servers: *a15
      operationId: API-AUTH-008
      summary: Set a new password
      description: Used by /reset-password. Authorise with the access token from the reset link.
      parameters:
        - *a16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
