    post:
      summary: Send outbound message (API-MSG-003)
      tags:
        - Messaging
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,128}$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectType:
                  type: string
                  enum: *a13
                subjectId:
                  type: string
                  minLength: 1
                channel:
                  type: string
                  enum: *a4
                templateCode:
                  type: string
                  minLength: 1
                templateVersion:
                  type: integer
                  exclusiveMinimum: 0
                recipient:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    mobile:
                      type: string
                      pattern: ^\+?[1-9]\d{9,14}$
                    name:
                      type: string
                      maxLength: 100
                variables:
                  type: object
                  additionalProperties:
                    anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  default: *a14
                correlationId:
                  type: string
              required:
                - subjectType
                - subjectId
                - channel
                - templateCode
                - recipient
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^msg_[0-9A-HJKMNP-TV-Z]{26}$
                  tenantId:
                    type: string
                  direction:
                    type: string
                    enum: *a15
                  channel:
                    type: string
                    enum: *a4
                  subjectType:
                    type: string
                  subjectId:
                    type: string
                  templateVersionId:
                    type: string
                  recipientHash:
                    type: string
                  recipientMasked:
                    type: string
                  variablesRedacted:
                    type: object
                    additionalProperties: {}
                  provider:
                    type: string
                  providerMessageId:
                    type:
                      - string
                      - "null"
                  status:
                    type: string
                    enum: *a7
                  statusHistory:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: *a7
                        timestamp:
                          type: string
                        reason:
                          type: string
                        providerEventId:
                          type: string
                      required:
                        - status
                        - timestamp
                  blockedReason:
                    type:
                      - string
                      - "null"
                  lockVersion:
                    type: integer
                    minimum: 0
                  createdAt:
                    type: string
                  createdBy:
                    type: string
                  updatedAt:
                    type: string
                  updatedBy:
                    type: string
                required:
                  - id
                  - tenantId
                  - direction
                  - channel
                  - subjectType
                  - subjectId
                  - templateVersionId
                  - recipientHash
                  - recipientMasked
                  - variablesRedacted
                  - provider
