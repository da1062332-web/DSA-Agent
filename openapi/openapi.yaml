paths:
  /health:
    get:
      summary: Liveness probe (the only unauthenticated path)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /v1/me:
    get:
      operationId: API-USR-010
      summary: "The signed-in user: profile, grants, MFA state"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
                  tenantId:
                    type: string
                    pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
                  email:
                    type: string
                  displayName:
                    type: string
                  primaryBranchId:
                    type:
                      - string
                      - "null"
                  queueIds:
                    type: array
                    items:
                      type: string
                  grants:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - lead.read
                            - lead.create
                            - lead.update
                            - lead.qualify
                            - lead.assign
                            - lead.reopen
                            - customer.read
                            - customer.create
                            - customer.update
                            - customer.reveal_sensitive
                            - consent.record
                            - activity.create
                            - activity.update
                            - task.read
                            - task.create
                            - task.update
                            - application.read
                            - application.create
                            - application.update
                            - application.cancel
                            - application.review
                            - document.review
                            - lender_case.submit
                            - lender_case.update_status
                            - rule.author
                            - rule.simulate
                            - rule.approve
                            - rule.publish
                            - rule.suspend
                            - audit.read
                            - config.manage
                            - user.manage
                            - message.send
                            - lender.read
                            - lender.manage
                            - product.read
                            - product.manage
                            - commission.plan.edit
                            - commission.plan.approve
                            - commission.calculate
                            - finance.view
                            - adjustment.create
                            - adjustment.approve
                            - payout.request
                            - payout.approve
                            - payout.record_payment
                        scope:
                          type: string
                          enum:
                            - OWN
                            - TEAM
                            - BRANCH
                            - TENANT
                        branchIds:
                          type: array
                          items:
                            type: string
                      required:
                        - code
                        - scope
                        - branchIds
                  mfaVerifiedAt:
                    type:
                      - string
                      - "null"
                required:
                  - id
                  - tenantId
                  - email
                  - displayName
                  - primaryBranchId
                  - queueIds
                  - grants
                  - mfaVerifiedAt
        "401":
          description: UNAUTHENTICATED or TOKEN_EXPIRED
    patch:
      operationId: API-USR-009
      summary: Update user profile notification preferences with concurrency control (API-USR-009)
      tags:
        - MOD-USR Users
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Expected lock_version for optimistic concurrency control
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationPreferences:
                  type: object
                  properties:
                    channels:
                      type: object
                      properties:
                        inApp:
                          type: boolean
                          default: true
                        email:
                          type: boolean
                          default: false
                        sms:
                          type: boolean
                          default: false
                        whatsapp:
                          type: boolean
                          default: false
                      default: *a11
                    digestFrequency:
                      type: string
                      enum: *a12
                      default: IMMEDIATE
                    mutedCategories:
                      type: array
                      items:
                        type: string
                        enum: *a10
                      default: *a13
                preferences:
                  type: object
                  properties:
                    channels:
                      type: object
                      properties:
                        inApp:
                          type: boolean
                          default: true
                        email:
                          type: boolean
                          default: false
                        sms:
                          type: boolean
                          default: false
                        whatsapp:
                          type: boolean
                          default: false
                      default: *a11
                    digestFrequency:
                      type: string
                      enum: *a12
                      default: IMMEDIATE
                    mutedCategories:
                      type: array
                      items:
                        type: string
                        enum: *a10
                      default: *a13
      responses:
        "200":
          description: Updated user profile
          headers:
            ETag:
              schema:
                type: string
              description: Updated lock_version
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
                  tenantId:
                    type: string
                  email:
                    type: string
                    format: email
                  displayName:
                    type: string
                  userType:
                    type: string
                  status:
                    type: string
                  availability:
                    type: string
                  primaryBranchId:
                    type: string
                  lockVersion:
                    type: integer
                    minimum: 0
                  notificationPreferences:
                    type: object
                    properties:
                      channels:
                        type: object
                        properties:
                          inApp:
                            type: boolean
                            default: true
                          email:
                            type: boolean
                            default: false
                          sms:
                            type: boolean
                            default: false
                          whatsapp:
                            type: boolean
                            default: false
                        default: *a11
                      digestFrequency:
                        type: string
                        enum: *a12
                        default: IMMEDIATE
                      mutedCategories:
                        type: array
                        items:
                          type: string
                          enum: *a10
                        default: *a13
                required:
                  - id
                  - tenantId
