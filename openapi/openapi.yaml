              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error_code:
                    type: string
                  msg:
                    type: string
  /factors/{factor_id}/challenge:
    post:
      tags: *a12
      servers: *a13
      operationId: API-AUTH-009a
      summary: Start an MFA challenge
      description: First half of step-up (API-AUTH-009) and of sign-in with MFA.
      parameters:
        - *a14
        - name: factor_id
          in: path
