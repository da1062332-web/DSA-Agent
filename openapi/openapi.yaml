                  type: string
                  enum: *a1
                  default: MEDIUM
                tags:
                  type: array
                  items:
                    type: string
                  default: *a20
                consent:
                  type: object
                  properties:
                    purpose:
                      type: string
                      enum: *a21
                      default: CONTACT
                    purposeTarget:
                      type:
                        - string
                        - "null"
                    noticeVersion:
                      type: string
                      pattern: ^[a-zA-Z0-9._-]{2,40}$
                    channel:
                      type: string
                      enum: *a22
                    evidenceRef:
                      type:
                        - string
                        - "null"
                  required:
                    - noticeVersion
                    - channel
              required:
                - fullName
                - mobile
                - productCategory
                - branchId
                - source
                - consent
      responses:
        "201":
          description: Lead created successfully
          headers:
            ETag:
              schema:
                type: string
              description: Lead lock version
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
                    enum:
                      - NEW
                  mobileMasked:
                    type: string
                  duplicateFlag:
                    type: string
                  lockVersion:
                    type: number
                required:
                  - id
                  - state
                  - mobileMasked
                  - duplicateFlag
                  - lockVersion
