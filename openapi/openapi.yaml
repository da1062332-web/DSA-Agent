                  type: array
                  items:
                    type: string
                  default: *a34
                consent:
                  type: object
                  properties:
                    purpose:
                      type: string
                      enum: *a35
                      default: CONTACT
                    purposeTarget:
                      type:
                        - string
                        - "null"
