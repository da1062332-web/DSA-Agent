    patch:
      operationId: API-USR-009
      summary: Update user profile notification preferences with concurrency control (API-USR-009)
      tags:
        - MOD-USR Users
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Expected lock_version for optimistic concurrency control
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationPreferences:
                  type: object
                  properties:
                    channels:
                      type: object
                      properties:
                        inApp:
                          type: boolean
                          default: true
                        email:
                          type: boolean
                          default: false
                        sms:
                          type: boolean
                          default: false
                        whatsapp:
                          type: boolean
                          default: false
                      default: *a11
                    digestFrequency:
                      type: string
                      enum: *a12
                      default: IMMEDIATE
                    mutedCategories:
                      type: array
                      items:
                        type: string
                        enum: *a10
                      default: *a13
                preferences:
                  type: object
                  properties:
                    channels:
                      type: object
                      properties:
                        inApp:
                          type: boolean
                          default: true
                        email:
                          type: boolean
                          default: false
                        sms:
                          type: boolean
                          default: false
                        whatsapp:
                          type: boolean
                          default: false
                      default: *a11
                    digestFrequency:
                      type: string
                      enum: *a12
                      default: IMMEDIATE
                    mutedCategories:
                      type: array
                      items:
                        type: string
                        enum: *a10
                      default: *a13
      responses:
        "200":
          description: Updated user profile
          headers:
            ETag:
              schema:
                type: string
              description: Updated lock_version
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
                  tenantId:
                    type: string
                  email:
                    type: string
                    format: email
                  displayName:
                    type: string
                  userType:
                    type: string
                  status:
                    type: string
                  availability:
                    type: string
                  primaryBranchId:
                    type: string
                  lockVersion:
                    type: integer
                    minimum: 0
                  notificationPreferences:
                    type: object
                    properties:
                      channels:
                        type: object
                        properties:
                          inApp:
                            type: boolean
                            default: true
                          email:
                            type: boolean
                            default: false
                          sms:
                            type: boolean
                            default: false
                          whatsapp:
                            type: boolean
                            default: false
                        default: *a11
                      digestFrequency:
                        type: string
                        enum: *a12
                        default: IMMEDIATE
                      mutedCategories:
                        type: array
                        items:
                          type: string
                          enum: *a10
                        default: *a13
                required:
                  - id
                  - tenantId
                  - email
                  - displayName
                  - userType
                  - status
                  - availability
                  - primaryBranchId
                  - lockVersion
                  - notificationPreferences
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      httpStatus:
                        type: integer
                      correlationId:
                        type: string
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            issue:
                              type: string
                            meta:
                              type: object
                              additionalProperties: {}
                          required:
                            - issue
                      retryable:
                        type: boolean
                    required:
                      - code
                      - message
                      - httpStatus
                      - correlationId
                      - retryable
                required:
                  - error
        "412":
          description: Precondition Failed (concurrent update detected)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      httpStatus:
                        type: integer
                      correlationId:
                        type: string
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
