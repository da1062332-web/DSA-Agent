              schema:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
                    enum:
                      - NEW
                  mobileMasked:
                    type: string
                  duplicateFlag:
                    type: string
                  lockVersion:
                    type: number
                required:
                  - id
                  - state
                  - mobileMasked
                  - duplicateFlag
                  - lockVersion
