                  type: array
                  items:
                    type: string
                  default: *a29
                consent:
                  type: object
                  properties:
                    purpose:
                      type: string
                      enum: *a30
                      default: CONTACT
                    purposeTarget:
                      type:
                        - string
                        - "null"
