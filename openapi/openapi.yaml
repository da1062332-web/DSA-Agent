  /factors/{factor_id}/verify:
    post:
      tags: *a14
      servers: *a15
      operationId: API-AUTH-002
      summary: Verify a 6-digit authenticator code
      description: Completes sign-in with MFA, verifies a new authenticator (enrolment), or completes step-up (API-AUTH-009). A successful step-up sets the aal2 session that the API checks for 900 s.
      parameters:
        - *a16
        - name: factor_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_id:
                  type: string
                code:
                  type: string
                  pattern: ^\d{6}$
              required:
                - challenge_id
                - code
      responses:
        "200":
          description: Session upgraded to aal2
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: "JWT. Send as Authorization: Bearer <token> on /v1 calls."
                  token_type:
                    type: string
                    enum:
                      - bearer
                  expires_in:
                    type: integer
                    description: Seconds until access_token expires (3600 by default).
                  expires_at:
                    type: integer
                  refresh_token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Auth user id. Equals app_user.idp_subject.
                      email:
                        type: string
                        format: email
                      app_metadata:
                        type: object
                        properties:
                          tenant_id:
                            type: string
                        required:
                          - tenant_id
                    required:
                      - id
                      - email
                      - app_metadata
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - expires_at
                  - refresh_token
                  - user
        "400":
          description: Rejected by Supabase (see error_code, e.g. invalid_credentials)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error_code:
                    type: string
                  msg:
                    type: string
        "401":
          description: Rejected by Supabase (see error_code, e.g. invalid_credentials)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error_code:
                    type: string
                  msg:
                    type: string
